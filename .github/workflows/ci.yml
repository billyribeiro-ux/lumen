name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.16.0'

jobs:
  lint-typecheck:
    name: Lint + type check
    runs-on: ubuntu-24.04
    # `pnpm check` resolves `$env/static/private` (e.g. DATABASE_URL) at
    # svelte-kit sync time; dummy values satisfy the type generation without
    # touching a real database.
    env:
      DATABASE_URL: postgres://user:password@localhost/lumen-ci
      BETTER_AUTH_SECRET: dummy-ci-secret-not-used-at-runtime
    steps:
      - uses: actions/checkout@v6
      # No `version:` input — pnpm/action-setup reads `packageManager` from
      # package.json. Specifying both errors with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:lint
      - run: pnpm check
      - run: pnpm db:check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    # The server test project imports `src/lib/server/**`, which evaluates the
    # Drizzle/Neon client at module load (reads DATABASE_URL). Dummy values let
    # the modules import; no test actually opens a connection.
    env:
      DATABASE_URL: postgres://user:password@localhost/lumen-ci
      BETTER_AUTH_SECRET: dummy-ci-secret-not-used-at-runtime
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:unit --run

  e2e-tests:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.NEON_PREVIEW_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.CI_BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:4173
      - run: pnpm test:e2e
        env:
          DATABASE_URL: ${{ secrets.NEON_PREVIEW_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.CI_BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:4173

  build:
    name: Production build smoke
    runs-on: ubuntu-24.04
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          DATABASE_URL: postgres://user:password@localhost/lumen-build-smoke
          BETTER_AUTH_SECRET: dummy-build-secret-not-used-at-runtime

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
